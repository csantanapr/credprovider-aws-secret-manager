apiVersion: apps/v1
kind: Deployment
metadata:
  name: aws-sm-credential-provider
  namespace: ate-system
  labels:
    app: aws-sm-credential-provider
spec:
  # Two replicas: a restart or a node drain must not fail every injection.
  replicas: 2
  selector:
    matchLabels:
      app: aws-sm-credential-provider
  template:
    metadata:
      labels:
        app: aws-sm-credential-provider
    spec:
      serviceAccountName: aws-sm-credential-provider
      # The provider does not call the Kubernetes API. EKS Pod Identity injects
      # its own projected token independently of the API bearer token.
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: aws-sm-credential-provider
      containers:
      - name: aws-sm-credential-provider
        image: ko://plugins.go.ate.dev/credprovider-aws-secret-manager/cmd/aws-sm-credential-provider
        args:
        - "--listen-address=:50051"
        - "--health-address=:9090"
        # A servicedns certificate for aws-sm-credential-provider.ate-system.svc,
        # the name the egress gateway pins when it dials the provider.
        - "--server-cred-bundle=/run/servicedns.podcert.ate.dev/credential-bundle.pem"
        # Admit only the egress gateway (atenet-egress in ate-system). Change
        # the namespace if substrate runs elsewhere.
        - "--client-ca-file=/run/podidentity.podcert.ate.dev/trust-bundle.pem"
        - "--injector-identity=spiffe://cluster.local/ns/ate-system/sa/atenet-egress"
        # Enforce the atespace→secrets authorization policy (default-deny).
        - "--secret-policy-file=/etc/aws-sm-credential-provider/secret-policy.yaml"
        # The cluster's Region, for STS. The provider refuses to start until
        # this is a real Region name.
        - "--region=REPLACE_WITH_AWS_REGION"
        # Pin startup to the role associated with this ServiceAccount. Replace
        # the partition (aws, aws-us-gov, aws-cn, ...), account, and role path.
        - "--expected-role-arn=arn:REPLACE_WITH_AWS_PARTITION:iam::REPLACE_WITH_AWS_ACCOUNT_ID:role/aws-sm-credential-provider"
        # Under the egress gateway's 4s budget for all of a request's injections.
        - "--fetch-timeout=2s"
        # After a rotation the old value is injected for up to this long.
        - "--cache-ttl=30s"
        # Bound both retained payloads and distinct reads. Per-atespace
        # admission prevents one tenant from consuming the global allowance.
        - "--cache-max-bytes=67108864"
        - "--fetch-concurrency=64"
        - "--atespace-fetch-concurrency=8"
        - "--rpc-concurrency=128"
        - "--grpc-connection-limit=16"
        # Reauthenticate long-lived HTTP/2 clients after certificate rotation.
        - "--max-connection-age=5m"
        - "--max-connection-age-grace=30s"
        - "--log-level=info"
        # Optional: IAM also enforces atespace isolation, and CloudTrail names
        # the atespace (README, Per-atespace IAM).
        # - "--atespace-role-arn=arn:REPLACE_WITH_AWS_PARTITION:iam::REPLACE_WITH_AWS_ACCOUNT_ID:role/ate-secrets-reader"
        ports:
        - name: grpc
          containerPort: 50051
        - name: health
          containerPort: 9090
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          periodSeconds: 20
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: secret-policy
          mountPath: /etc/aws-sm-credential-provider
          readOnly: true
        - name: servicedns
          mountPath: /run/servicedns.podcert.ate.dev
          readOnly: true
        - name: podidentity
          mountPath: /run/podidentity.podcert.ate.dev
          readOnly: true
      volumes:
      # Created by secret-policy.yaml, which the kustomization omits so a
      # redeploy never overwrites an edited policy.
      - name: secret-policy
        configMap:
          name: aws-sm-credential-provider-secret-policy
      # The serving certificate, issued for the Services that select this pod.
      - name: servicedns
        projected:
          sources:
          - podCertificate:
              signerName: servicedns.podcert.ate.dev/identity
              keyType: ECDSAP256
              credentialBundlePath: credential-bundle.pem
      # The CA the egress gateway's client certificate chains to.
      - name: podidentity
        projected:
          sources:
          - clusterTrustBundle:
              signerName: podidentity.podcert.ate.dev/identity
              labelSelector:
                matchLabels:
                  podcert.ate.dev/canarying: live
              path: trust-bundle.pem
