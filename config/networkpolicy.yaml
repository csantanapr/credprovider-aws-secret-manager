# ate-system is default-deny ingress (substrate's
# manifests/ate-install/ate-system-networkpolicies.yaml). This admits the
# egress gateway's pods, and nothing else, on the gRPC port, as substrate's
# k8s-credential-provider NetworkPolicy does. It takes effect only where the
# network plugin enforces NetworkPolicy, such as the Amazon VPC CNI with
# enableNetworkPolicy; elsewhere the mTLS caller pin is the only restriction.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aws-sm-credential-provider
  namespace: ate-system
spec:
  podSelector:
    matchLabels:
      app: aws-sm-credential-provider
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: atenet-egress
    ports:
    - protocol: TCP
      port: 50051
