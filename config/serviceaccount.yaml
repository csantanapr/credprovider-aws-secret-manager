# The provider's AWS identity. It needs no Kubernetes RBAC and no annotation:
# an EKS Pod Identity association binds an IAM role to this ServiceAccount
# (README, Install step 1).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aws-sm-credential-provider
  namespace: ate-system
