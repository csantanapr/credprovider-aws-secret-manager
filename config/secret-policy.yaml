# Which Secrets Manager secrets each atespace may resolve. An actor resolves a
# secret only if a grant for its atespace names the URI's account, Region and
# either the secret's name (name) or a hierarchy the name is under
# (namePrefix, which ends in /). An atespace that isn't listed resolves nothing.
#
# Apply this before deploying the provider; the kustomization leaves it out so
# a redeploy doesn't overwrite it. The provider reads it only at startup, so
# restart the Deployment after editing it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: aws-sm-credential-provider-secret-policy
  namespace: ate-system
data:
  secret-policy.yaml: |
    # Actors in atespace "team-a" may use every secret under ate/team-a/ in
    # account 111122223333, us-west-2, e.g.
    # ate-secret://secretsmanager.amazonaws.com/accounts/111122223333/regions/us-west-2/secrets/ate/team-a/github/stages/AWSCURRENT.
    # Quote account IDs: unquoted, YAML reads them as numbers.
    policies:
    - atespace: team-a
      allowedSecrets:
      - account: "111122223333"
        region: us-west-2
        namePrefix: ate/team-a/
